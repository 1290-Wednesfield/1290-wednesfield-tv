<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>1290 Wednesfield Squadron TV</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #071b33;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================
           TOP ROLLING TICKER
        ========================= */

        .ticker-bar {
            height: 7vh;
            min-height: 55px;
            background: #071b33;
            border-bottom: 5px solid #f5c400;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .ticker-track {
            display: flex;
            white-space: nowrap;
            animation: ticker 35s linear infinite;
            font-size: 1.6vw;
            font-weight: bold;
        }

        .ticker-item {
            margin-right: 80px;
        }

        .ticker-item span {
            color: #f5c400;
        }

        @keyframes ticker {
            from {
                transform: translateX(100vw);
            }

            to {
                transform: translateX(-100%);
            }
        }

        /* =========================
           MAIN SCREEN
        ========================= */

        .screen {
            height: 93vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .screen-content {
            width: 92%;
            height: 88%;
            border: 2px solid #ffffff;
            padding: 4vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .crest-placeholder {
            width: 180px;
            height: 180px;
            border: 3px solid #f5c400;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f5c400;
            font-size: 20px;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 5vw;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 2.5vw;
            color: #f5c400;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        p {
            font-size: 1.6vw;
            max-width: 1000px;
            line-height: 1.5;
            color: #d7e1eb;
        }

        .screen-number {
            position: absolute;
            bottom: 20px;
            right: 35px;
            color: #71869d;
            font-size: 14px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55px;
            border-top: 2px solid #f5c400;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d7e1eb;
            font-size: 15px;
            letter-spacing: 1px;
        }

        @media (max-width: 1000px) {
            .ticker-track {
                font-size: 18px;
            }

            h1 {
                font-size: 42px;
            }

            h2 {
                font-size: 25px;
            }

            p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         PERMANENT TICKER
    ========================= -->

    <div class="ticker-bar">

        <div class="ticker-track">

            <div class="ticker-item">
                <span>DATE:</span> Loading...
            </div>

            <div class="ticker-item">
                <span>DUTY SNCO:</span> Loading...
            </div>

            <div class="ticker-item">
                <span>DUTY JNCO:</span> Loading...
            </div>

            <div class="ticker-item">
                <span>TONIGHT:</span> Loading...
            </div>

            <div class="ticker-item">
                <span>NEWS:</span> No current announcements
            </div>

            <div class="ticker-item">
                <span>TIME:</span> <span id="clock">--:--</span>
            </div>

        </div>

    </div>


    <!-- =========================
         MAIN TV AREA
    ========================= -->

    <main class="screen">

        <section class="screen-content">

            <div class="crest-placeholder">
                1290
            </div>

            <h1>1290 Wednesfield</h1>

            <h2>Royal Air Force Air Cadets</h2>

            <p>
                Welcome to the 1290 Wednesfield Squadron
                information display.
            </p>

        </section>

        <div class="screen-number">
            SCREEN 1
        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="footer">
        1290 WEDNESFIELD SQUADRON • VENTURE ADVENTURE
    </footer>


    <!-- =========================
         CLOCK
    ========================= -->

    <script>

        function updateClock() {

            const now = new Date();

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('clock').textContent =
                hours + ':' + minutes;
        }

        updateClock();

        setInterval(updateClock, 1000);

    </script>

</body>
</html>
