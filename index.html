<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>1290 Wednesfield Squadron TV</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #071b33;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        .top-bar {
            height: 70px;
            background: #ffffff;
            color: #071b33;
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-bottom: 6px solid #f5c400;
            font-weight: bold;
        }

        .squadron {
            font-size: 26px;
            white-space: nowrap;
        }

        .ticker {
            margin-left: 40px;
            overflow: hidden;
            flex: 1;
        }

        .ticker-text {
            white-space: nowrap;
            animation: ticker 25s linear infinite;
        }

        @keyframes ticker {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(-100%);
            }
        }

        .main {
            height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .welcome {
            max-width: 1000px;
        }

        .welcome h1 {
            font-size: 72px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .welcome h2 {
            color: #f5c400;
            font-size: 38px;
            margin-bottom: 30px;
        }

        .welcome p {
            font-size: 24px;
            opacity: 0.9;
        }

        .status {
            margin-top: 40px;
            display: inline-block;
            padding: 15px 30px;
            border: 2px solid #f5c400;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header class="top-bar">
        <div class="squadron">
            1290 WEDNESFIELD
        </div>

        <div class="ticker">
            <div class="ticker-text">
                WELCOME TO 1290 WEDNESFIELD SQUADRON • VENTURE ADVENTURE •
                RAF AIR CADETS • TV SYSTEM INITIALISING •
            </div>
        </div>
    </header>

    <main class="main">
        <section class="welcome">

            <h1>1290 Wednesfield Squadron</h1>

            <h2>TV DISPLAY SYSTEM</h2>

            <p>
                Squadron information, training, events and announcements
                will appear here.
            </p>

            <div class="status">
                SYSTEM INITIALISING
            </div>

        </section>
    </main>

</body>
</html>
